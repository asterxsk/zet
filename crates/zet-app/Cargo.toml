[package]
name = "zet-app"
description = "What a terminal does when you press a key, with no window in sight"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
zet-vt.workspace = true
zet-pty.workspace = true
zet-config.workspace = true
zet-input.workspace = true
zet-session.workspace = true
zet-render.workspace = true

thiserror.workspace = true

# The numbers PRODUCT.md promises are measured rather than assumed. Its own harness,
# because there is no benchmark crate here and a timing threshold on a shared runner
# would be a flaky test with a longer name.
[[bench]]
name = "latency"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

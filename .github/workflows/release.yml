name: Release

# Tag-driven: `git tag v0.2.0 && git push origin v0.2.0` is the whole release procedure.
#
# Two artifacts are published, and both are wanted. `zet-<version>-<target>.exe` is the
# bare binary, which is what `zet-update` looks for by that exact suffix and replaces in
# place. `zet-<version>-setup.exe` is the per-user installer from `packaging/`, which is
# what a person downloads the first time.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The default token is read-only. Publishing a release needs write, and nothing else here
# needs anything at all.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `zet --version` prints the commit it was built from, which is only true if the
          # checkout is deep enough to resolve one.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The tag and the manifest are two places that both claim a version. If they
      # disagree, the release publishes a binary that reports a different version from the
      # one it was released under, and the updater then offers it forever: every launch
      # downloads the same archive, installs a binary that still calls itself old, and
      # asks again. Cheaper to refuse the tag.
      - name: The tag and Cargo.toml agree on the version
        shell: pwsh
        run: |
          $version = $null
          $inWorkspacePackage = $false
          foreach ($line in Get-Content Cargo.toml) {
            if ($line -match '^\s*\[') {
              $inWorkspacePackage = $line.Trim() -eq '[workspace.package]'
              continue
            }
            if ($inWorkspacePackage -and $line -match '^\s*version\s*=\s*"([^"]+)"') {
              $version = $Matches[1]
              break
            }
          }
          if (-not $version) { throw 'no version found under [workspace.package]' }

          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($tag -ne $version) {
            throw "tag v$tag does not match the workspace version $version"
          }
          Write-Host "releasing $version"

      - name: Build
        run: cargo build --release --locked -p zet

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $target = 'x86_64-pc-windows-msvc'
          $name = "zet-$version-$target.exe"
          Copy-Item "target/release/zet.exe" $name

          # The installer. Inno Setup is in the runner image; see packaging/README.md for
          # why it is built the way it is.
          ISCC.exe /Q "/DVersion=$version" /O"dist" /F"zet-$version-setup" packaging\zet.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = "zet-$version-setup.exe"
          Copy-Item "dist/$setup" $setup

          # A digest per file, published beside them. The updater refuses an archive whose
          # SHA-256 does not match its line here, so a truncated or substituted download
          # never becomes the binary that runs.
          $lines = @($name, $setup) | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $_"
          }
          [IO.File]::WriteAllText("$PWD/SHA256SUMS", ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # NOT `--prerelease`. The updater reads `/releases/latest`, which skips anything
          # GitHub marks as a pre-release, so marking a 0.x release that way would publish
          # a version no existing install could ever see.
          #
          # Named one by one rather than as a glob. `zet-*.exe` would work today and would
          # quietly start uploading whatever else happens to match tomorrow.
          $version = '${{ github.ref_name }}'.TrimStart('v')
          gh release create '${{ github.ref_name }}' `
            --title 'zet ${{ github.ref_name }}' `
            --generate-notes `
            --verify-tag `
            "zet-$version-x86_64-pc-windows-msvc.exe" `
            "zet-$version-setup.exe" `
            SHA256SUMS

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. A push while a run is going supersedes it, because the only result
# anyone reads is the one for the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A warning that nobody has to fix is a warning nobody reads.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The tests that talk to GitHub are `#[ignore]`d so that a flaky network is never
      # the reason a pull request looks broken. Nothing here runs them; see
      # `crates/zet-update/tests/live.rs` for how to run them on purpose.

  # PRODUCT.md promises the latency numbers are measured rather than assumed, so they
  # are measured on every push. Its own job because the bench profile is a second
  # optimized build of half the workspace, and nothing needs it: the job is not in any
  # `needs`, so a slow runner printing a number nobody likes still shows a green tick
  # beside the commit that changed it. That is the point — the 300 ms budget in
  # criterion 1 is a check on a real machine, and a hosted runner is not one.
  latency:
    name: the numbers, measured
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cold start, keystroke, throughput
        run: cargo bench -p zet-app --bench latency

  package:
    name: the installer compiles
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Inno Setup 6.7.1 is in the runner image and its Chocolatey package puts ISCC.exe
      # on PATH, so there is nothing to install.
      - name: Inno Setup is available
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { throw 'ISCC.exe is not on PATH' }
          Write-Host "using $iscc"

      # The script's `[Files]` entries name the real binary, so the real binary has to
      # exist. `-p zet` and not `--workspace`: the installer ships one executable.
      - name: Build
        run: cargo build --release --locked -p zet

      # A packaging script is code, and it rots the same way. Compiling it on every push
      # is what stops the release-day discovery that it has been broken for a month —
      # which is the usual fate of a script that only runs when a tag is pushed.
      - name: Compile the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          if (-not $version) { throw 'no version found in Cargo.toml' }
          ISCC.exe /Q "/DVersion=$version" /O"dist" packaging\zet.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist
